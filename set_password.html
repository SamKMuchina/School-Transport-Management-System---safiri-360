<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Set Your Password - School Transport Management</title>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>
<body class="login-page-body">

<div class="login-container">

    <div class="login-header">
        <span class="login-system-title">School<span>Track</span></span>
        <span class="login-subtitle">Set Your Password</span>
    </div>

    <form method="POST" action="set_password.php">
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-input" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label class="form-label">New Password</label>
            <input type="password" name="new_password" id="new_password" class="form-input" placeholder="At least 6 characters">
        </div>
        <div class="form-group">
            <label class="form-label">Confirm Password</label>
            <input type="password" name="confirm_password" id="confirm_password" class="form-input" placeholder="Repeat your password">
        </div>
        <button type="submit" class="login-btn">Set Password and Login</button>
    </form>

    <div class="back-link">
        <a href="login.html">Back to Login</a>
    </div>

</div>

</body>
</html>
