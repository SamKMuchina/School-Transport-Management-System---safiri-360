<html>
<head>
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <title>Login - School Transport Management</title>
    <link rel="stylesheet" type="text/css" href="assets/css/style.css">
</head>
<body class="login-page-body">

<div class="login-container">

    <div class="login-header">
        <span class="login-system-title">School<span>Track</span></span>
        <span class="login-subtitle">Transport Management System</span>
    </div>

    <form method="POST" action="login.php">
        <div class="form-group">
            <label class="form-label">Username</label>
            <input type="text" name="username" id="username" class="form-input" placeholder="Enter your username">
        </div>
        <div class="form-group">
            <label class="form-label">Password</label>
            <input type="password" name="password" id="password" class="form-input" placeholder="Enter your password">
        </div>
        <button type="submit" class="login-btn">Login</button>
    </form>

    <div class="new-user-section">
        <a href="set_password.html">New user? Set your password</a>
    </div>

</div>

</body>
</html>
